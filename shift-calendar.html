<title>교대 달력</title>
<style>
:root{--bar:#444;--bg:#fff;--fg:#3a3a3a;--mute:#9a9a9a;--line:#ececec;--off:#fafafa;--sun:#e5384f;--sat:#3b6bc9;--chip:#fde3e6;--blue:#0a7cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#4b4d57;--bg:#17181b;--fg:#e6e6e6;--mute:#7d7d85;--line:#2a2b30;--off:#1d1e22;--chip:#47262c}}
:root[data-theme="dark"]{--bar:#4b4d57;--bg:#17181b;--fg:#e6e6e6;--mute:#7d7d85;--line:#2a2b30;--off:#1d1e22;--chip:#47262c}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;--d:min(7.1vw,34px);--mh:100px}
header{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;flex:none}
header svg{display:block}
.ttl{position:relative;font-size:27px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#pick{position:absolute;top:0;left:0;height:100%;width:100%;opacity:0;cursor:pointer}
.today-btn{border:1.5px solid var(--fg);border-radius:20px;background:none;color:var(--fg);font:inherit;font-size:14px;padding:3px 13px}

.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);flex:none}
.wd span:first-child{color:var(--sun)}.wd span:last-child{color:var(--sat)}
#g{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow-y:auto;scrollbar-width:none}
#g::-webkit-scrollbar{display:none}
.c{cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.c:nth-child(7n){border-right:0}
.c.off{background:var(--off)}
.t{display:flex;align-items:center;gap:3px;width:100%;box-sizing:border-box;padding:6px 5px 0;font-size:13px}
.n{color:var(--fg);flex:none}
.c:nth-child(7n+1) .n,.hd .n{color:var(--sun)}
.c:nth-child(7n) .n{color:var(--sat)}
.off .n{opacity:.45}
.today{outline:2px solid var(--blue);outline-offset:-2px}
.today .n{background:var(--blue);color:#fff!important;border-radius:50%;width:20px;height:20px;line-height:20px;margin:-2.2px 0 -2.2px -3px;text-align:center}
.s{margin-left:auto;font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hl{position:absolute;top:23px;left:3px;right:3px;box-sizing:border-box;padding:1px 0;border-radius:3px;background:var(--chip);color:var(--sun);font-size:min(2.6vw,10px);line-height:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off .hl{opacity:.6}
.k{width:var(--d);height:var(--d);margin-top:min(3.2vh,22px);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(var(--d)*.55);color:#fff}
.k.a{background:#ffd600;color:#3a3a3a}
.k.b{background:#4d7de6}
.k.y{background:#3c3c3c}
.k.r{background:none;color:#e8505b;width:auto}
.off .k{opacity:.3}
.m{width:calc(100% - 4px);box-sizing:border-box;margin:3px 2px 0;padding:2px 3px;background:var(--bar);color:#fff;border-radius:3px;font-size:9px;line-height:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m:last-child{margin-bottom:3px}
.off .m{opacity:.5}
#sh{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;display:none;flex-direction:column;background:var(--bg);background:color-mix(in srgb,var(--tc,#ffd600) 16%,var(--bg))}
#sh.on{display:flex}
.x{position:absolute;top:12px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--fg);display:grid;place-items:center}
#sd{padding:34px 18px 0;font-size:26px;font-weight:800}
#sd small{font-size:15px;font-weight:500;color:var(--mute);margin-left:8px}
.nv{display:flex;align-items:center;padding:14px 6px 18px}
.nv>button{border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:8px}
#sk{margin:0 auto 0 4px;width:44px;height:44px;font-size:24px}
.bd{flex:1;min-height:0;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 18px 18px}
.tab{display:inline-block;font-size:20px;font-weight:800;padding-bottom:6px;border-bottom:4px solid var(--fg);margin-bottom:18px}
.mc{display:flex;flex-wrap:wrap;align-items:center;background:var(--bar);color:#fff;border-radius:12px;padding:16px 14px;margin-bottom:10px;font-size:17px;word-break:break-word}
.mc>span{flex:1;min-width:0}
.mc button{border:0;background:none;color:#cbd5ff;font:inherit;font-size:14px;padding:6px 8px}
.mc .mk{color:#bbb;padding:2px;display:grid}
.mc input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit}
.ac{width:100%;display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.nw{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mute);font:inherit;font-size:19px;padding:12px 6px}
.mo{flex:none;box-sizing:border-box;height:var(--mh);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:6px;padding:8px 12px}
.mo button{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:0}
.mo .cur{border-color:var(--blue);color:var(--blue)}
.mo .sel{background:var(--blue);border-color:var(--blue);color:#fff}


</style>
</head>
<body>
<div id="app">
<header>
<span style="display:flex" id="i-menu"></span>
<div class="ttl"><span id="tx"></span><input id="pick" type="month" min="2026-09" aria-label="월 선택"></div>
<button class="today-btn" id="today">오늘</button>
</header>
<div class="wd"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div id="g"></div>
<div class="mo" id="mo"></div>
<div id="sh">
<button class="x" id="sx" aria-label="닫기"></button>
<div id="sd"></div>
<div class="nv"><button id="sp" aria-label="전날"></button><div class="k" id="sk"></div><button id="sn" aria-label="다음날"></button></div>
<div class="bd"><div class="tab">메모</div><div id="ml"></div></div>
</div>
</div>
<script>
onerror=(m,u,l)=>{try{document.body.insertAdjacentHTML('afterbegin','<pre style="position:fixed;top:0;left:0;right:0;z-index:99;margin:0;background:#fff;color:#d00;font-size:11px;white-space:pre-wrap">'+m+' / '+l+'</pre>')}catch(e){}};
const $=s=>document.querySelector(s),DAY=864e5,A=Date.UTC(2026,8,28,3),MIN=2026*12+8;
const IC={menu:'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z',doc:'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z',share:'M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z',chart:'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z',cal:'M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z',ppl:'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',dash:'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z',alarm:'M12.5 8H11v6l4.75 2.85.75-1.23-4-2.37V8zM12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zM7.88 3.39L6.6 1.86 2 5.71l1.29 1.53 4.59-3.85zM22 5.72l-4.6-3.86-1.29 1.53 4.6 3.86L22 5.72z',chat:'M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 11H6V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z',up:'M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z'};
const sv=(k,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="${IC[k]}"/></svg>`;
$('#i-menu').innerHTML=sv('menu',30);



/* 근무 패턴: 월~금 주 단위 주→후→야 반복, 주말 휴 (2026-09-28 주 = 후 로 기준 정렬) */
const shift=t=>{const w=new Date(t).getUTCDay();if(!w||w==6)return 3;return(((Math.floor((t-A)/(7*DAY))+1)%3)+3)%3};

/* 음력(단기력) */
let LF;try{LF=new Intl.DateTimeFormat('en-u-ca-dangi',{month:'numeric',day:'numeric',timeZone:'Asia/Seoul'})}catch(e){}
const lun=t=>{try{const p=LF.formatToParts(new Date(t)),g=k=>(p.find(x=>x.type==k)||{}).value||'0';return[parseInt(g('month'))||0,parseInt(g('day'))||0,/bis/i.test(g('month'))]}catch(e){return[0,0,0]}};
if(LF){const r=lun(Date.UTC(2028,0,27,3));if(r[0]!=1||r[1]!=1)LF=null}

/* 공휴일 + 대체공휴일 */
const HC={},wk=t=>{const w=new Date(t).getUTCDay();return w==0||w==6};
function HD(y){
 if(HC[y])return HC[y];
 const h={},T=(m,d)=>Date.UTC(y,m,d,3),ws=[],cnt={};
 const add=(a,n,k)=>{ws.push([a,n,k]);a.forEach(t=>cnt[t]=(cnt[t]||0)+1)};
 [[0,1,'신정',0],[2,1,'삼일절',1],[4,5,'어린이날',1],[5,6,'현충일',0],[7,15,'광복절',1],[9,3,'개천절',1],[9,9,'한글날',1],[11,25,'성탄절',1]].forEach(([m,d,n,k])=>add([T(m,d)],[n],k));
 for(let t=T(0,1);t<=T(11,31);t+=DAY){const[m,d,l]=lun(t);if(l)continue;
  if(m==1&&d==1)add([t-DAY,t,t+DAY],['설연휴','설날','설연휴'],2);
  if(m==4&&d==8)add([t],['부처님오신날'],1);
  if(m==8&&d==15)add([t-DAY,t,t+DAY],['추석연휴','추석','추석연휴'],2)}
 ws.forEach(([a,n])=>a.forEach((t,i)=>h[t]=n[i]||n[0]));
 ws.sort((p,q)=>p[0][0]-q[0][0]).forEach(([a,n,k])=>{
  if(!k)return;
  const need=a.some(t=>cnt[t]>1)||(k==2?a.some(t=>new Date(t).getUTCDay()==0):wk(a[0]));
  if(!need)return;
  let t=a[a.length-1]+DAY;while(wk(t)||h[t])t+=DAY;h[t]='대체공휴'});
 return HC[y]=h}

const now=()=>{const n=new Date();return[n.getFullYear()*12+n.getMonth(),Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),3)]};
let V=Math.max(now()[0],MIN);
const pad=n=>String(n).padStart(2,'0');
Object.assign(IC,{x:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',l:'M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z',r:'M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z',more:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',add:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'});
$('#sx').innerHTML=sv('x',22);$('#sp').innerHTML=sv('l',34);$('#sn').innerHTML=sv('r',34);
/* 메모: 월 단위로 저장 (로그인 시 개인 DB + 브라우저 백업) */
let MEM={},DBR=null,Q=Promise.resolve(),SD=0,ED=null,AC=null,DL=null,NV=0;
try{MEM=JSON.parse(localStorage.getItem('shiftMemos'))||{}}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymk=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)};
const gm=t=>(MEM[ymk(t)]||{})[new Date(t).getUTCDate()]||[];
function put(k){
 try{localStorage.setItem('shiftMemos',JSON.stringify(MEM))}catch(e){}
 if(DBR)Q=Q.then(()=>DBR(k).set({d:MEM[k]})).catch(()=>{})}
function sm(t,L){const k=ymk(t),m=MEM[k]=MEM[k]||{},n=new Date(t).getUTCDate();if(L.length)m[n]=L;else delete m[n];put(k)}
function openDay(t){SD=t;ED=AC=DL=null;NV=0;sheet();$('#sh').classList.add('on')}
function step(n){SD+=n*DAY;ED=AC=DL=null;NV=1;sheet()}
function closeDay(){if(NV){const d=new Date(SD);V=Math.max(d.getUTCFullYear()*12+d.getUTCMonth(),MIN)}SD=0;$('#sh').classList.remove('on');draw()}
function sheet(){
 const d=new Date(SD),s=shift(SD),[lm,ld,lp]=lun(SD),L=gm(SD),k=$('#sk');
 $('#sh').style.setProperty('--tc',['#ffd600','#4d7de6','#3c3c3c','#e8505b'][s]);
 $('#sd').innerHTML=`${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${'일월화수목금토'[d.getUTCDay()]}요일${lm?`<small>음 ${lp?'윤':''}${pad(lm)}.${pad(ld)}</small>`:''}`;
 k.className='k '+'abyr'[s];k.textContent='주후야휴'[s];
 const ei=ph=>`<div class="mc"><input id="ei" maxlength="80" placeholder="${ph}"><button data-a="s">저장</button><button data-a="c">취소</button></div>`;
 $('#ml').innerHTML=L.map(x=>x.i==ED?ei(''):`<div class="mc" data-i="${x.i}"><span>${esc(x.t)}</span><button class="mk" data-a="m">${sv('more',20)}</button>${AC==x.i?`<div class="ac"><button data-a="e">수정</button><button data-a="d"${DL==x.i?' style="color:#ff8a8a"':''}>${DL==x.i?'정말 삭제':'삭제'}</button></div>`:''}</div>`).join('')+(ED=='n'?ei('메모 입력'):`<button class="nw" data-a="n">${sv('add',28)}새 메모</button>`);
 const e=$('#ei');if(e){e.value=ED=='n'?'':(L.find(x=>x.i==ED)||{}).t||'';e.focus()}}
function draw(){
 const[CM,TD]=now(),y=Math.floor(V/12),m=V%12,f=Date.UTC(y,m,1,3),off=new Date(f).getUTCDay(),
  rows=Math.ceil((off+new Date(Date.UTC(y,m+1,0)).getUTCDate())/7),st=f-off*DAY;
 let h='';
 for(let i=0;i<rows*7;i++){
  const t=st+i*DAY,d=new Date(t),hn=HD(d.getUTCFullYear())[t],s=shift(t);
  let sub='';
  const[lm,ld,lp]=lun(t);if(ld==1||ld==15)sub=`<span class="s">${lp?'윤':''}${lm}.${ld}</span>`;
  h+=`<div class="c${d.getUTCMonth()==m?'':' off'}${t==TD?' today':''}${hn?' hd':''}" data-t="${t}">${hn?`<span class="hl">${hn}</span>`:''}<div class="t"><span class="n">${d.getUTCDate()}</span>${sub}</div><div class="k ${'abyr'[s]}">${'주후야휴'[s]}</div>${gm(t).map(x=>`<div class="m">${esc(x.t)}</div>`).join('')}</div>`}
 $('#g').innerHTML=h;
 $('#tx').textContent=y+'. '+pad(m+1);
 $('#pick').value=y+'-'+pad(m+1);
 let b='';
 for(let i=0;i<12;i++){const k=Math.max(CM-2,MIN)+i;b+=`<button class="${k==V?'sel':k==CM?'cur':''}" data-v="${k}">${String(Math.floor(k/12)).slice(2)}.${pad(k%12+1)}</button>`}
 $('#mo').innerHTML=b;
}
const go=d=>{if(V+d<MIN)return;V+=d;draw()};
$('#today').onclick=()=>{V=Math.max(now()[0],MIN);draw()};
$('#pick').onclick=function(){try{this.showPicker()}catch(e){}};
$('#pick').onchange=function(){if(!this.value)return;const[y,m]=this.value.split('-').map(Number);V=Math.max(y*12+m-1,MIN);draw()};
$('#mo').onclick=e=>{const b=e.target.closest('button');if(b){V=+b.dataset.v;draw()}};
const G=$('#g');let sx=0,sy=0,dx=0,on=0,mv=0;
const slide=(x,a)=>{G.style.transition=a?'transform .2s ease-out':'none';G.style.transform='translateX('+x+'px)'};
G.onpointerdown=e=>{if(e.button)return;on=1;mv=0;sx=e.clientX;sy=e.clientY;dx=0};
G.onpointermove=e=>{if(!on)return;const mx=e.clientX-sx;if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(e.clientY-sy)){if(!mv){mv=1;try{G.setPointerCapture(e.pointerId)}catch(x){}}dx=mx;slide(dx,0)}};
G.onpointerup=G.onpointercancel=e=>{
 if(!on)return;on=0;
 const w=G.offsetWidth,d=dx<0?1:-1;
 if(e.type=='pointerup'&&Math.abs(dx)>60&&V+d>=MIN){
  slide(-d*w,1);
  setTimeout(()=>{V+=d;draw();slide(d*w,0);G.offsetWidth;slide(0,1)},200)
 }else slide(0,1)};
G.onclick=e=>{if(mv)return;const c=e.target.closest('.c');if(c)openDay(+c.dataset.t)};
$('#sx').onclick=closeDay;
$('#sp').onclick=()=>step(-1);
$('#sn').onclick=()=>step(1);
$('#ml').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.a,c=b.closest('[data-i]'),i=c&&c.dataset.i,L=gm(SD).slice();
 if(a=='n')ED='n';
 else if(a=='m'){AC=AC==i?null:i;DL=null}
 else if(a=='e'){ED=i;AC=DL=null}
 else if(a=='d'){if(DL==i){sm(SD,L.filter(x=>x.i!=i));AC=DL=null}else DL=i}
 else if(a=='c')ED=null;
 else if(a=='s'){const v=$('#ei').value.trim();if(v){if(ED=='n')L.push({i:uid(),t:v});else L.forEach(x=>{if(x.i==ED)x.t=v});sm(SD,L)}ED=null}
 sheet()};
$('#ml').onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='ei'&&!e.isComposing){e.preventDefault();$('#ml [data-a="s"]').click()}};
addEventListener('keydown',e=>{if(e.isComposing||e.target.tagName=='INPUT')return;if(SD){if(e.key=='Escape')closeDay();return}if(e.key=='ArrowLeft')go(-1);if(e.key=='ArrowRight')go(1)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});
draw();
(async()=>{try{
 const[D,U]=await Promise.all([claude.use('db'),claude.use('user')]),id=U&&await U.id();
 if(!D||!id)return;
 const p='data/users/'+id,s=await Promise.race([D.collection(p).get(),new Promise((_,r)=>setTimeout(r,1e4))]),got={};
 s.docs.forEach(x=>{const v=x.data();if(v&&v.d){MEM[x.id]=v.d;got[x.id]=1}});
 DBR=k=>D.doc(p+'/'+k);
 for(const k in MEM)if(!got[k])put(k);
 try{localStorage.setItem('shiftMemos',JSON.stringify(MEM))}catch(e){}
 draw();if(SD&&!ED)sheet()
}catch(e){}})();
</script>
